name: Build

# Build the Whysho EQ1 plugin on Windows and macOS, package installers, upload
# them as artifacts, and (on a v* tag) publish them to a GitHub Release.

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:

# Avoid piling up runs on fast pushes to the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # macOS runners may be unavailable (billing / not enabled); don't let a
    # cancelled or failed macOS leg block the Windows build or the release.
    continue-on-error: ${{ matrix.name == 'macos' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-14
            name: macos

    env:
      # Keep fetched dependency sources (JUCE via CPM/FetchContent) in a cacheable
      # location shared across runs.
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so scripts/version.sh can resolve the version.
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="$(bash scripts/version.sh)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Cache dependencies (CPM / FetchContent)
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cpm-cache
            ${{ github.workspace }}/build/_deps
          key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS universal2)
        if: runner.os == 'macOS'
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Package installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PWD: ${{ secrets.WINDOWS_CERT_PWD }}
          WINDOWS_CERT_TIMESTAMP: ${{ secrets.WINDOWS_CERT_TIMESTAMP }}
        run: ./scripts/build-windows-installer.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Package installer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERT }}
          APPLE_CERT_PWD: ${{ secrets.APPLE_CERT_PWD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGN_ID_APP: ${{ secrets.APPLE_SIGN_ID_APP }}
          APPLE_SIGN_ID_INSTALLER: ${{ secrets.APPLE_SIGN_ID_INSTALLER }}
          AC_NOTARY_PROFILE: ${{ secrets.AC_NOTARY_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
        run: bash scripts/build-macos-installer.sh --version ${{ steps.version.outputs.version }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhyshoEQ1-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release
    needs: build
    # always() so a cancelled/unavailable macOS leg never skips the release;
    # the Windows installer still publishes. Guarded to v* tags only.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f -print || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
          draft: false
          # 0.x releases are pre-releases (early, may be unsigned / partial-OS).
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
