name: Build

# Build the Whysho EQ1 plugin on Windows and macOS, package installers, upload
# them as artifacts, and (on a v* tag) publish them to a GitHub Release.

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:

# Avoid piling up runs on fast pushes to the same ref.
concurrency:
  group: build-${{ github.ref }}
  # Never cancel a release build half-way through publishing.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # macOS runners may be unavailable (billing / not enabled); don't let a
    # cancelled or failed macOS leg block the Windows build or the release.
    continue-on-error: ${{ matrix.name == 'macos' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          # Self-hosted macOS runner (your Mac) — GitHub-hosted macOS runners
          # are gated on this account. Builds a universal x86_64+arm64 binary.
          # Revert to `os: macos-13` once hosted macOS is available.
          - os: [self-hosted, macOS]
            name: macos

    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags too, so scripts/version.sh can check the release tag.
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          # The version comes from CMakeLists.txt. On a v* tag this fails if the
          # tag and CMakeLists.txt disagree.
          VERSION="$(bash scripts/version.sh --check-tag)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Cache dependencies (FetchContent)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/_deps
          key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS universal2)
        if: runner.os == 'macOS'
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (licensing rules, DSP stress)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Package installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:   # signing secrets are only handed to release (tag) builds
          WINDOWS_CERT_PFX_BASE64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CERT_PFX_BASE64 || '' }}
          WINDOWS_CERT_PWD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CERT_PWD || '' }}
          WINDOWS_CERT_TIMESTAMP: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CERT_TIMESTAMP || '' }}
        run: ./scripts/build-windows-installer.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Package installer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERT: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERT || '' }}
          APPLE_CERT_PWD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERT_PWD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}
          APPLE_SIGN_ID_APP: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_SIGN_ID_APP || '' }}
          APPLE_SIGN_ID_INSTALLER: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_SIGN_ID_INSTALLER || '' }}
          AC_NOTARY_PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.AC_NOTARY_PROFILE || '' }}
          APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
          AC_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.AC_PASSWORD || '' }}
        run: bash scripts/build-macos-installer.sh --version ${{ steps.version.outputs.version }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhyshoEQ1-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release
    needs: build
    # Only on v* tags, and only when the build job succeeded (the macOS leg is
    # allowed to be missing, see continue-on-error above; Windows is not).
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f -print || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
          # Published as a draft: check the installers, then publish by hand.
          draft: true
          # 0.x releases are pre-releases (early, may be unsigned / partial-OS).
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
